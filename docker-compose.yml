services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: karma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: karma
    ports:
      - "5432:5432"
    volumes:
      - karma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karma"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: karma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - karma_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  karma_pgdata:
  karma_redisdata:
